name: Deploy navlog server

# The live flight-planner demo (examples/navlog) runs its server on Railway.
# Railway builds examples/navlog/server/Dockerfile.railway with the repository
# root as the build context, so the image changes whenever the server, a
# workspace package it depends on, or the docs the CLI bundles change. The
# Railway GitHub App is not connected to this repository; like threadplane's
# deploy workflows, this one uploads the checkout with the Railway CLI under a
# project token scoped to the demo's project and environment.
#
# `railway up --detach` returns when the upload is accepted, so the second step
# follows the deployment it created until Railway reports SUCCESS, and fails
# the workflow on anything else: a broken build must not hide behind the last
# good image. The health probe at the end confirms the new container answers.

on:
  push:
    branches:
      - main
    paths:
      - examples/navlog/server/**
      - packages/**
      - apps/web/content/docs/**
      - apps/web/app/components/docs/nav.ts
      - apps/web/app/components/docs/api-reference-pages.ts
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .npmrc
      - tsconfig.json
      - .dockerignore
      - .github/workflows/deploy-navlog.yml
  workflow_dispatch:
    inputs:
      diagnose:
        description: Read build logs without deploying
        type: boolean
        default: false
      deployment_id:
        description: Railway deployment UUID to diagnose
        type: string
        required: false
        default: fac8e87f-5b1a-49b8-a951-c92c576fb40c

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.diagnose }}
    name: Deploy navlog-server to Railway
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0

      - name: Upload the checkout to Railway
        id: upload
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_NAVLOG_TOKEN }}
        run: |
          npx --yes @railway/cli@5.63.1 up --service navlog-server --environment production --detach | tee railway-up.log
          deployment="$(sed -n 's/.*[?&]id=\([0-9a-f-]\{36\}\).*/\1/p' railway-up.log | head -n 1)"
          if [ -z "$deployment" ]; then
            echo "::error::railway up did not report a deployment id" >&2
            exit 1
          fi
          echo "deployment=$deployment" >> "$GITHUB_OUTPUT"

      - name: Wait for the rollout
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_NAVLOG_TOKEN }}
          DEPLOYMENT_ID: ${{ steps.upload.outputs.deployment }}
        run: |
          node - <<'JS'
          const id = process.env.DEPLOYMENT_ID
          const deadline = Date.now() + 25 * 60 * 1000
          const query = "query($id: String!) { deployment(id: $id) { status } }"
          while (true) {
            const response = await fetch("https://backboard.railway.com/graphql/v2", {
              method: "POST",
              headers: {
                "content-type": "application/json",
                "project-access-token": process.env.RAILWAY_TOKEN,
              },
              body: JSON.stringify({ query, variables: { id } }),
            })
            const body = await response.json()
            const status = body?.data?.deployment?.status
            if (!status) {
              console.error("Railway did not report a status:", JSON.stringify(body))
              process.exit(1)
            }
            console.log(new Date().toISOString(), status)
            if (status === "SUCCESS") break
            if (["FAILED", "CRASHED", "REMOVED", "SKIPPED"].includes(status)) {
              console.error(`Deployment ${id} ended as ${status}`)
              process.exit(1)
            }
            if (Date.now() > deadline) {
              console.error(`Deployment ${id} still ${status} after 25 minutes`)
              process.exit(1)
            }
            await new Promise((resolve) => setTimeout(resolve, 20000))
          }
          JS

      - name: Probe the live server
        run: |
          for attempt in 1 2 3 4 5 6; do
            if curl --fail --silent --show-error --max-time 10 https://b4-navlog-server.up.railway.app/healthz; then
              echo
              exit 0
            fi
            sleep 10
          done
          echo "::error::navlog-server did not answer /healthz after the rollout" >&2
          exit 1

  diagnose:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.diagnose }}
    name: Read Railway build logs without deploying
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0

      - name: Read bounded build logs
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_NAVLOG_TOKEN }}
          DEPLOYMENT_ID: ${{ inputs.deployment_id }}
        run: |
          node - <<'JS'
          const id = process.env.DEPLOYMENT_ID ?? ""
          const token = process.env.RAILWAY_TOKEN ?? ""
          if (!/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/iu.test(id) || id.length !== 36) {
            console.error("Railway diagnostic: a valid deployment UUID is required")
            process.exitCode = 1
          } else if (!token) {
            console.error("Railway diagnostic: project credential is unavailable")
            process.exitCode = 1
          } else {
            // Fixed read-only query from https://docs.railway.com/integrations/api/manage-deployments.
            const query = "query($deploymentId: String!, $limit: Int) { buildLogs(deploymentId: $deploymentId, limit: $limit) { timestamp message severity } }"
            let failure = "request failed or timed out"
            try {
              const response = await fetch("https://backboard.railway.com/graphql/v2", {
                method: "POST",
                redirect: "error",
                headers: {
                  "content-type": "application/json",
                  "project-access-token": token,
                },
                body: JSON.stringify({ query, variables: { deploymentId: id, limit: 500 } }),
                signal: AbortSignal.timeout(30000),
              })
              if (!response.ok) {
                failure = `build log request returned HTTP ${response.status}`
                throw new Error()
              }
              failure = "invalid, errored, or excessive build log response"
              // Bound the response while reading; Content-Length alone is not trustworthy.
              const reader = response.body.getReader()
              const decoder = new TextDecoder("utf-8", { fatal: true })
              let bytes = 0
              let text = ""
              try {
                while (true) {
                  const { done, value } = await reader.read()
                  if (done) break
                  bytes += value.byteLength
                  if (bytes > 2 * 1024 * 1024) {
                    await reader.cancel()
                    throw new Error()
                  }
                  text += decoder.decode(value, { stream: true })
                }
                text += decoder.decode()
              } finally {
                reader.releaseLock()
              }
              const body = JSON.parse(text)
              if (body.errors !== undefined && (!Array.isArray(body.errors) || body.errors.length)) throw new Error()
              const logs = body?.data?.buildLogs
              if (!Array.isArray(logs) || logs.length > 501 || logs.some((log) =>
                !log || ["timestamp", "message", "severity"].some((field) => typeof log[field] !== "string")
              )) throw new Error()
              const sanitize = (value) => {
                // Redact before truncation so a partial credential cannot escape the cap.
                const redacted = value.replaceAll(token, "[REDACTED]").split(/\r\n|[\n\r\u2028\u2029]/u).map((line) =>
                  /\b[\w-]*(?:token|password|secret|api[_-]?key|access[_-]?key|private[_-]?key)[\w-]*["']?\s*[:=]|\bauthorization\s*:|\bbearer\s+\S+|\b[a-z][a-z0-9+.-]*:\/\/[^\s/:@]+:[^\s@]+@/iu.test(line)
                    ? "[REDACTED credential-bearing line]" : line
                ).join("\n")
                return redacted.length > 8192 ? `${redacted.slice(0, 8192)} [truncated]` : redacted
              }
              const encoder = new TextEncoder()
              let outputBytes = 0
              // Railway can return limit+1 rows; retain the requested tail, as its CLI does.
              for (const log of logs.slice(-500)) {
                // Legacy runner commands parse anywhere; escape their opener in serialized JSON.
                const line = "Railway build log: " + JSON.stringify({
                  timestamp: sanitize(log.timestamp),
                  message: sanitize(log.message),
                  severity: sanitize(log.severity),
                }).replaceAll("##[", "\\u0023#[")
                outputBytes += encoder.encode(line).byteLength + 1
                if (outputBytes > 256 * 1024) {
                  console.error("Railway diagnostic: output truncated at 256 KiB")
                  break
                }
                console.log(line)
              }
              if (!logs.length) console.error("Railway diagnostic: no build logs returned")
            } catch {
              // Do not echo provider bodies, thrown errors, headers, or credentials.
              console.error(`Railway diagnostic: ${failure}`)
              process.exitCode = 1
            }
          }
          JS
