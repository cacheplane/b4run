name: Auto Approve

# Submits a formal APPROVE review as github-actions[bot] (an identity distinct from
# the PR author). This is what OSSF Scorecard's Code-Review check reads from
# the reviews API. It does NOT count toward branch-protection required
# reviews and has no power to merge — the maintainer still merges. Skips
# fork PRs (read-only token there). See the approval body and
# audit-known-issues.md for the full rationale.
#
# PREREQUISITE: repo/org setting "Allow GitHub Actions to create and approve
# pull requests" must be enabled, or the approve step errors.

on:
  pull_request:
    types: [opened, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  approve:
    # Only same-repo PRs: fork PRs get a read-only token and cannot approve. Never the
    # software factory's: its code is model output no person has reviewed (rung 4 spec §9).
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      !startsWith(github.event.pull_request.head.ref, 'factory/') &&
      github.event.pull_request.user.login != 'b4-factory[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      - name: Approve pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh pr review "$PR_NUMBER" --approve \
            --body "Automated approval for repository bookkeeping. The maintainer reviews and merges this PR."
