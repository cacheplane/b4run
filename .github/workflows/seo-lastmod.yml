name: SEO lastmod

# Keeps apps/web/app/seo/lastmod.generated.json current on main, so that
# regenerating it is never a pull request author's job.
#
# WHY THE FILE IS STILL COMMITTED. The manifest is the only record of when
# each route's content last changed: the generator preserves an entry's
# timestamp while its source digest matches and stamps "now" when it does
# not. Nothing else stores that history — the generator never consults Git,
# deliberately, so that a shallow deploy checkout produces the same output as
# a full clone. It is also imported statically by apps/web/app/seo/lastmod.ts,
# so it has to exist on disk for typecheck and next build. Generating it from
# scratch during a build would therefore stamp every route with the build's
# own clock and destroy the signal it exists to carry.
#
# WHAT THIS BUYS. Pull requests no longer touch the file at all, so two
# branches that both edit docs stop conflicting inside a generated artifact,
# and a merge no longer lands a manifest whose timestamps are whenever the
# author happened to run the script. The timestamp now reflects when the
# content reached main, which is the date the sitemap is claiming.
#
# LOOP SAFETY. The push trigger is scoped to the content this manifest is
# derived from. This job's own commit touches only the manifest, which is not
# in that path list, so it cannot retrigger itself.
#
# WHY A PULL REQUEST AND NOT A DIRECT PUSH. main requires the "validate"
# status check, and a direct push carries no check run that can satisfy it,
# so every push from this job was rejected with GH006 until it opened a pull
# request instead. Bypassing that gate would mean either a ruleset exemption
# or an admin credential; an auto-merging bot pull request keeps branch
# protection intact and needs no new secret. The pull request is opened with
# RELEASE_GITHUB_TOKEN because a pull request created with GITHUB_TOKEN does
# not trigger workflows, so "validate" would never run and auto-merge would
# wait forever.

on:
  push:
    branches:
      - main
    paths:
      - apps/web/content/**
      - apps/web/app/page.tsx
      - apps/web/app/components/homepage/**

permissions:
  contents: read

concurrency:
  # Serialize against itself: two runs regenerating and pushing the same file
  # would race. Never cancel in progress — a cancelled run leaves main with a
  # stale manifest and no scheduled successor.
  group: seo-lastmod-main
  cancel-in-progress: false

jobs:
  regenerate:
    name: regenerate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Push with this job's own token rather than the checkout's
          # persisted credentials, so the push and the rebase below use one
          # explicit remote.
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.33.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.17.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Regenerate the manifest
        run: pnpm --dir apps/web seo:lastmod

      - name: Open a pull request when it changed
        env:
          # A pull request opened with GITHUB_TOKEN does not trigger the
          # workflows whose checks it has to pass, so use the same token the
          # Version Packages job already uses for exactly that reason.
          GH_TOKEN: ${{ secrets.RELEASE_GITHUB_TOKEN }}
          MANIFEST: apps/web/app/seo/lastmod.generated.json
          BRANCH: automation/seo-lastmod
        run: |
          set -eu
          if git diff --quiet -- "$MANIFEST"; then
            echo "Manifest already current; nothing to open."
            exit 0
          fi

          # Fail loudly if the run dirtied anything else: this job is only
          # ever allowed to move one generated file.
          UNEXPECTED="$(git diff --name-only -- . ":(exclude)$MANIFEST")"
          if [ -n "$UNEXPECTED" ]; then
            echo "::error::Refusing to open: unexpected changes outside the manifest:"
            echo "$UNEXPECTED"
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "$MANIFEST"
          # No [skip ci]: this commit reaches main through a pull request, so
          # its checks are the gate that lets it in.
          git commit -m "chore(web): regenerate SEO lastmod manifest"

          REMOTE="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          # The branch is rebuilt from the current tip on every run and only
          # ever carries this one generated file, so replacing it outright is
          # what "current" means here. main itself is never force-pushed.
          git push --force "$REMOTE" "HEAD:refs/heads/${BRANCH}"

          OPEN="$(gh pr list --head "$BRANCH" --state open --json number --jq '.[].number')"
          if [ -z "$OPEN" ]; then
            gh pr create \
              --base "${GITHUB_REF_NAME}" \
              --head "$BRANCH" \
              --title "chore(web): regenerate SEO lastmod manifest" \
              --body "Generated by the SEO lastmod workflow. The manifest records when each route's content last changed; regenerating it on main keeps that timestamp out of pull request authors' hands."
          fi

          # Auto-merge lands it as soon as validate passes, so a docs merge
          # never waits on a human to click.
          gh pr merge "$BRANCH" --auto --squash
