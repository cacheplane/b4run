name: PostHog signal quality

on:
  workflow_dispatch:
    inputs:
      days:
        description: Days of live events to inspect
        required: false
        default: "7"
      limit_per_event:
        description: Maximum events to sample per contracted event
        required: false
        default: "100"
  schedule:
    - cron: "23 14 * * *"

concurrency:
  group: posthog-signal-quality
  cancel-in-progress: false

permissions:
  contents: read

env:
  DO_NOT_TRACK: "1"

jobs:
  live-quality:
    name: Live signal contract and coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.33.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.17.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Plan dashboards and run live quality check
        env:
          POSTHOG_PERSONAL_API_KEY: ${{ secrets.POSTHOG_PERSONAL_API_KEY_READONLY }}
          POSTHOG_HOST: https://us.i.posthog.com
          POSTHOG_PROJECT_ID: ${{ secrets.POSTHOG_PROJECT_ID }}
          DAYS: ${{ github.event.inputs.days || '7' }}
          LIMIT: ${{ github.event.inputs.limit_per_event || '100' }}
        run: |
          set -euo pipefail
          if [ -z "${POSTHOG_PERSONAL_API_KEY:-}" ] || [ -z "${POSTHOG_PROJECT_ID:-}" ]; then
            echo "::error::POSTHOG_PERSONAL_API_KEY_READONLY and POSTHOG_PROJECT_ID Actions secrets are required."
            exit 1
          fi
          pnpm posthog:plan
          pnpm posthog:quality --days "$DAYS" --limit-per-event "$LIMIT"
